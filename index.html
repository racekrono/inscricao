    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Garante a autenticação para permitir a gravação no Firestore
    signInAnonymously(auth).then(() => {
      console.log("Firebase Autenticado com Sucesso!");
    }).catch((err) => {
      console.warn("Aviso de Auth no Firebase:", err);
    });

    // Função global para salvar a inscrição no Firestore
    window.salvarInscricaoFirebase = async function(dadosInscricao, statusPagamento = 'pendente_ou_simulacao') {
      try {
        const docRef = await addDoc(collection(db, "inscricoes_rally"), {
          ...dadosInscricao,
          status_pagamento: statusPagamento,
          criado_em: serverTimestamp()
        });
        console.log("Inscrição salva com sucesso no Firestore. ID:", docRef.id);
        return docRef.id;
      } catch (e) {
        console.error("Erro ao salvar no Firestore: ", e);
        return null;
      }

    };
  </script>
