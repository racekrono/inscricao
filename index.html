  <!-- Firebase v11 Imports -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Configuração do Firebase do cliente
    const firebaseConfig = {
      apiKey: "AIzaSyA8PsEMRmOSCBtREIIjYFhOb6fa-oJKGj4",
      authDomain: "inscricao-417f8.firebaseapp.com",
      databaseURL: "https://inscricao-417f8-default-rtdb.firebaseio.com",
      projectId: "inscricao-417f8",
      storageBucket: "inscricao-417f8.firebasestorage.app",
      messagingSenderId: "487856327569",
      appId: "1:487856327569:web:366f29aa0798098aa06830",
      measurementId: "G-6Q5QH05XYL"
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Garante a autenticação para permitir leitura/gravação no Firestore
    signInAnonymously(auth).then(() => {
      console.log("Firebase Autenticado com Sucesso!");
      carregarDadosEventoEInscricoes();
    }).catch((err) => {
      console.warn("Aviso de Auth no Firebase:", err);
    });

    // Função global para carregar dados do evento dinamicamente
    window.carregarDadosEventoEInscricoes = async function() {
      try {
        // 1. Carrega dados do evento
        const eventoDoc = await getDoc(doc(db, "configuracao_evento", "atual"));
        if (eventoDoc.exists()) {
          const evento = eventoDoc.data();
          window.eventoAtualConfig = evento;

          // Atualiza Interface Pública
          document.querySelectorAll('.dinamico-titulo-evento').forEach(el => el.innerText = evento.titulo);
          document.querySelectorAll('.dinamico-data-evento').forEach(el => el.innerText = evento.data_extenso);
          document.querySelectorAll('.dinamico-local-evento').forEach(el => el.innerText = evento.local);
          document.querySelectorAll('.dinamico-lote').forEach(el => el.innerText = evento.lote_nome);
          document.querySelectorAll('.dinamico-valor').forEach(el => el.innerText = `R$ ${Number(evento.valor).toFixed(2).replace('.', ',')}`);
          
          if (document.getElementById('dinamico-descricao')) {
            document.getElementById('dinamico-descricao').innerHTML = evento.descricao_html;
          }

          // Atualiza Categorias no Select
          const catSelect = document.getElementById('categoria');
          if (catSelect && evento.categorias) {
            catSelect.innerHTML = '<option value="">Selecione uma categoria...</option>';
            evento.categorias.split('\n').forEach(cat => {
              if (cat.trim()) {
                const opt = document.createElement('option');
                opt.value = cat.trim();
                opt.innerText = cat.trim();
                catSelect.appendChild(opt);
              }
            });
          }

          // Preenche campos do Admin caso esteja aberto
          if (document.getElementById('admin_titulo')) {
            document.getElementById('admin_titulo').value = evento.titulo || '';
            document.getElementById('admin_data').value = evento.data_extenso || '';
            document.getElementById('admin_local').value = evento.local || '';
            document.getElementById('admin_lote').value = evento.lote_nome || '';
            document.getElementById('admin_valor').value = evento.valor || '';
            document.getElementById('admin_categorias').value = evento.categorias || '';
            document.getElementById('admin_descricao').value = evento.descricao_html || '';
            document.getElementById('admin_sheets_url').value = evento.google_sheets_url || '';
          }
        }

        // 2. Se a aba admin estiver ativa, carrega lista de inscrições
        if (window.carregarTabelaAdmin) {
          window.carregarTabelaAdmin();
        }

        // 3. Recarrega o Mercado Pago com o novo valor dinâmico
        if (typeof window.initMercadoPago === 'function') {
          window.initMercadoPago();
        }
      } catch(e) {
        console.log("Usando dados padrões do evento:", e);
      }
    };

    // Função global para salvar a inscrição no Firestore e enviar para Google Sheets
    window.salvarInscricaoFirebase = async function(dadosInscricao, statusPagamento = 'aprovado') {
      try {
        const payload = {
          ...dadosInscricao,
          status_pagamento: statusPagamento,
          criado_em: serverTimestamp()
        };

        const docRef = await addDoc(collection(db, "inscricoes_rally"), payload);

        // Envia também para o Google Sheets caso a URL esteja configurada
        const sheetsUrl = window.eventoAtualConfig ? window.eventoAtualConfig.google_sheets_url : '';
        if (sheetsUrl && sheetsUrl.trim() !== '') {
          try {
            fetch(sheetsUrl.trim(), {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            console.log("Inscrição enviada para a Planilha do Google Sheets!");
          } catch(sheetsErr) {
            console.warn("Erro ao enviar para Google Sheets:", sheetsErr);
          }
        }

        return docRef.id;
      } catch (e) {
        console.error("Erro ao salvar no Firestore: ", e);
        return null;
      }
    };
